<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal Cautivo - NetDevOps</title>
</head>
<body>
    <h1>Bienvenido al Portal Cautivo</h1>
    <form id="login-form">
        <label for="username">Usuario:</label>
        <input type="text" id="username" name="username" required>
        
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>
        
        <button type="submit" id="login-btn">Ingresar</button>
    </form>
    <div id="welcome-message"></div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();
            if (data.success) {
                document.getElementById('welcome-message').innerText = `Acceso concedido. ${data.vlanAssigned}`;
            } else {
                document.getElementById('welcome-message').innerText = 'Error de autenticación';
            }
        });
    </script>
</body>
</html>
